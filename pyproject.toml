[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-media-hub"
version = "0.1.0"
description = "Local Media Hub: High-performance unified Gateway & MCP Server for GPU-accelerated local image generation (ComfyUI headless backend)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Senior AI Software Architect" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.9",
    "mcp>=1.0.0",
    "pillow>=10.2.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
