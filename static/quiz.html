<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Studio • Local Media Hub</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191b23;--line:#2b2e3a;--muted:#9b9fac;--ink:#f1f1f5;--accent:#bdadff;--green:#80d6b0;--amber:#e7bf76}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button,a,select{cursor:pointer}button{border:1px solid var(--line);background:#242733;color:var(--ink);border-radius:10px;padding:9px 13px}button:hover{background:#303445}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--accent);color:#1e1538;font-weight:650;border-color:transparent}.primary:hover{background:#ccbeff}.ghost{background:transparent}a{color:var(--accent)}input,select,textarea{background:#13151c;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}input[type=checkbox]{accent-color:var(--accent)}textarea{width:100%;min-height:190px;resize:vertical}h1,h2,h3,p{margin-top:0}h1{font-size:25px;letter-spacing:-.6px}h2{font-size:19px}h3{font-size:16px}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh}aside{padding:27px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:25px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px}.brand b{font-size:17px}.brand-icon{width:39px;height:39px;display:grid;place-items:center;background:var(--accent);color:#201638;border-radius:13px;font-size:23px}nav{display:flex;flex-direction:column;gap:5px}nav button{text-align:left;padding:12px;border:none;background:transparent;color:var(--muted)}nav button.active{background:#302b42;color:#dfd5ff}nav button span{display:inline-block;width:26px;color:var(--accent)}.aside-bottom{margin-top:auto}.meter{height:5px;border-radius:6px;background:#30333e;overflow:hidden;margin:8px 0 14px}.meter i{height:100%;display:block;background:var(--green)}main{min-width:0}header{padding:20px 32px;display:flex;gap:20px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}header select{max-width:330px}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:2px;color:var(--accent);margin-bottom:4px}.toolbar,.selection{padding:14px 32px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px;flex-wrap:wrap}.toolbar label,.selection label{display:flex;align-items:center;gap:7px}.selection{background:#15171e}.status-banner{margin:22px 32px 0;padding:12px 16px;border:1px solid var(--line);border-radius:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.content{padding:28px 32px 60px}.heading{display:flex;justify-content:space-between;gap:18px;align-items:start;margin-bottom:22px}.heading p{color:var(--muted);margin-bottom:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.card-body{padding:17px}.card .cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#11131a}.placeholder{display:grid;place-items:center;color:#686d7d;min-height:180px;gap:10px}.tag{display:inline-block;border-radius:6px;padding:3px 7px;font-size:10px;background:#303244;color:#c8c5e0}.approved{color:var(--green);background:#18342b}.warn{color:var(--amber);background:#382e1d}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{font-size:12px;padding:7px 10px}.shots{display:flex;gap:7px;overflow:auto;padding-top:12px}.shots button{padding:0;overflow:hidden;flex-shrink:0;width:52px;height:52px;border-radius:9px}.shots img{width:100%;height:100%;object-fit:cover}.shots .chosen{border:2px solid var(--green)}.kit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}.kit-head{padding:17px;border-bottom:1px solid var(--line)}.kit-head p{margin:9px 0 0;font-size:13px;min-height:39px}.slot-grid{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.slot{min-width:0}.slot img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#12141b;cursor:zoom-in}.slot .empty{aspect-ratio:16/9;display:grid;place-items:center;background:#12141b;border:1px dashed #363a49;border-radius:9px;font-size:12px;color:var(--muted)}.slot.disabled{opacity:.45}.slot select{width:100%;font-size:11px;padding:5px;margin-top:6px}.slot .actions{gap:4px;margin-top:6px}.slot .actions button{padding:4px 7px;font-size:11px}.slot small{display:block;margin:5px 0;font-size:10px}.slot-title{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.stat{padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:13px}.stat b{font-size:28px;display:block;line-height:1.2;margin-bottom:5px}.import-box{padding:42px;background:var(--panel);border:1px dashed #55506b;border-radius:19px;text-align:center;max-width:760px;margin:20px auto}.import-box p{color:var(--muted)}.list{display:flex;flex-direction:column;gap:8px}.list-row{padding:12px 15px;display:flex;gap:15px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.list-row img{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}.list-row>div{flex:1}.list-row .tag{white-space:nowrap}.note{padding:16px;border:1px solid var(--line);border-radius:12px;background:#181922;color:var(--muted);margin:20px 0}.toast{position:fixed;bottom:22px;right:25px;padding:14px 20px;max-width:600px;background:#323049;color:#f2efff;border:1px solid #635d84;border-radius:12px;z-index:20;box-shadow:0 15px 60px #0007;display:none}dialog{border:1px solid #414552;border-radius:17px;background:var(--panel);color:var(--ink);max-width:760px;width:90%;padding:24px}dialog::backdrop{background:#000a}dialog .buttons{display:flex;gap:10px;justify-content:end;margin-top:18px}.ref-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ref-options label{display:flex;gap:10px;align-items:center;background:#12141b;padding:10px;border-radius:10px}.ref-options img{width:48px;height:48px;object-fit:cover;border-radius:7px}.lightbox img{width:100%;max-height:75vh;object-fit:contain}.lightbox{max-width:1200px}.hidden{display:none!important}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:15px}nav{flex-direction:row;overflow:auto;gap:0}nav button{white-space:nowrap}.aside-bottom{display:none}header,.toolbar,.selection{padding:15px 18px}.content{padding:22px 18px}.status-banner{margin:18px 18px 0}.stat-grid{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}.kit-grid{grid-template-columns:1fr}.heading{flex-wrap:wrap}}
</style></head><body>
<div class="shell"><aside><div class="brand"><div class="brand-icon">◈</div><div><b>Quiz Studio</b><div class="muted" style="font-size:11px">Imagens no seu PC</div></div></div><nav id="nav"></nav><div class="aside-bottom"><div class="row"><small>Concluído</small><small id="percent">0%</small></div><div class="meter"><i id="meter" style="width:0%"></i></div><p class="muted" style="font-size:11px">Projeto, referências e resultados ficam salvos neste computador.</p><a href="/" style="font-size:11px">Abrir ferramentas de imagem</a></div></aside>
<main><header><div><div class="eyebrow">Produção de quiz</div><h1 id="title" style="margin:0">Seu próximo quiz</h1></div><div class="actions" style="margin:0"><select id="projects" aria-label="Projeto salvo"><option value="">Abrir projeto salvo</option></select><button id="import-top">Importar JSON</button></div></header>
<div class="toolbar"><button class="primary" id="start" disabled>Iniciar produção</button><button id="pause" disabled>Pausar</button><label><input type="checkbox" id="manual">Exigir revisão manual</label><select id="engine" aria-label="Modelo de imagem"><option value="klein">Klein • usa referências</option><option value="flux">Flux Schnell • apenas texto</option><option value="sdxl">SDXL • apenas texto</option></select><label title="Impede retratos genéricos sem idade, pele, rosto, olhos, cabelo, barba e roupa"><input type="checkbox" id="require-profiles">Exigir ficha visual</label><span class="muted" id="connection">Verificando motor local…</span></div>
<div class="selection"><b style="font-size:12px">Seleção geral</b><div id="global" style="display:flex;gap:13px"></div><label><input type="checkbox" id="same-bg">Reutilizar fundo da pergunta</label><span class="muted" id="counts" style="font-size:12px">Nenhum projeto aberto</span></div>
<div class="status-banner"><span id="batch-message" role="status">Importe seu manifesto ou abra um projeto salvo.</span><span id="active-job"></span></div><section class="content" id="content"></section></main></div>
<input type="file" id="manifest-file" accept=".json,application/json" class="hidden"><input type="file" id="reference-file" accept="image/png,image/jpeg,image/webp" class="hidden">
<dialog id="editor"><h2 id="editor-title"></h2><div id="editor-body"></div><div class="buttons"><button id="editor-cancel">Cancelar</button><button class="primary" id="editor-save">Salvar</button></div></dialog>
<dialog id="lightbox" class="lightbox"><div class="row"><h3 id="lightbox-title"></h3><button id="lightbox-close">Fechar</button></div><img id="lightbox-image" alt="Prévia da imagem"></dialog><div id="toast" class="toast" role="status"></div>
<script>
const stages=[['project','01','Projeto'],['characters','02','Personagens'],['environment','03','Ambiente'],['kits','04','Kits'],['generation','05','Geração'],['downloads','06','Downloads']];
const labels={P:'P',R:'R',P_bg:'bgP',R_bg:'bgR'},stateLabels={pending:'Pendente',queued:'Na fila',processing:'Gerando',completed:'Concluída',failed:'Falha',cancelled:'Cancelada',uncertain:'Resultado incerto',blocked:'Bloqueada',disabled:'Desativada'};
let project=null,current='',stage='project',modal=null,uploadRef=null,refreshing=false,lastRendered='',projectList=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const refList=()=>Object.values(project?.reference_catalog||{}),slotList=()=>Object.entries(project?.slots||{}),role=i=>i.replace(/^\d+/,''),seed=()=>crypto.getRandomValues(new Uint32Array(1))[0],attempt=()=>crypto.randomUUID();
function toast(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',7000)}
async function api(path,method='GET',data){const options={method};if(data!==undefined){options.headers={'Content-Type':'application/json'};options.body=JSON.stringify(data)}const r=await fetch(path,options);if(!r.ok){let message=await r.text();try{message=JSON.parse(message).detail}catch{}throw Error(typeof message==='string'?message:JSON.stringify(message))}return await r.json()}
const route=()=>'/api/v1/production/'+encodeURIComponent(current);
async function update(){if(!current||refreshing)return;refreshing=true;try{project=await api(route());render()}catch(e){toast(e.message)}finally{refreshing=false}}
async function listProjects(){const d=await api('/api/v1/production/projects');projectList=d.projects;$('projects').innerHTML='<option value="">Abrir projeto salvo</option>'+projectList.map(p=>`<option value="${esc(p.project_id)}">${esc(p.title)}</option>`).join('');$('projects').value=current}
async function openProject(id){current=id;localStorage.setItem('quiz-studio-project',id);lastRendered='';await update();$('projects').value=id}
function nav(){ $('nav').innerHTML=stages.map(([id,n,name])=>`<button data-stage="${id}" class="${stage===id?'active':''}"><span>${n}</span>${name}</button>`).join('')}
function render(){nav();const active=slotList().filter(([i,s])=>s.enabled),done=active.filter(([i,s])=>s.status==='completed');$('title').textContent=project?.title||'Seu próximo quiz';$('start').disabled=!project||project.batch.status==='running';$('pause').disabled=!project||project.batch.status!=='running';$('start').textContent=project?.batch.status==='paused'?'Retomar produção':'Iniciar produção';$('counts').textContent=project?`${active.length} imagens selecionadas · ${done.length} concluídas · ${refList().filter(r=>r.approved_shot_id).length}/${refList().length} referências aprovadas`:'Nenhum projeto aberto';const percent=active.length?Math.round(done.length/active.length*100):0;$('percent').textContent=percent+'%';$('meter').style.width=percent+'%';$('manual').checked=!!project?.settings.manual_review;$('require-profiles').checked=!!project?.settings.require_character_profiles;$('same-bg').checked=!!project?.settings.use_same_background;if(project)$('engine').value=project.settings.engine;$('global').innerHTML=Object.entries(labels).map(([key,label])=>`<label><input type="checkbox" data-global="${key}" ${project?.settings.global_selection[key]?'checked':''} ${!project?'disabled':''}>${label}</label>`).join('');$('batch-message').textContent=project?.batch.message||'Importe seu manifesto ou abra um projeto salvo.';const activeSlot=slotList().find(([i,s])=>s.status==='processing');const activeRef=refList().find(r=>r.candidate_status.some(j=>j?.status==='processing'));const refJob=activeRef?.candidate_status.find(j=>j?.status==='processing');$('active-job').textContent=activeSlot?`${activeSlot[0]}.png · ${Math.round((activeSlot[1].job?.progress||0)*100)}%`:activeRef?`${activeRef.name} · ${Math.round((refJob.progress||0)*100)}%`:'';
const signature=JSON.stringify([stage,project]);if(signature===lastRendered)return;lastRendered=signature;
if(!project||stage==='project')renderProject();else if(stage==='characters'||stage==='environment')renderReferences();else if(stage==='kits')renderKits();else if(stage==='generation')renderGeneration();else renderDownloads()}
function renderProject(){const n=Object.keys(project?.slots||{}).length/4;$('content').innerHTML=`<div class="heading"><div><h2>Seu projeto de imagens</h2><p>O mesmo manifesto do Flow, com personagens, lugares, objetos e quatro imagens por kit.</p></div>${project?'<button data-action="backup">Salvar estado JSON</button>':''}</div>${project?`<div class="stat-grid"><div class="stat"><b>${n}</b><small>Kits</small></div><div class="stat"><b>${slotList().filter(([i,s])=>s.enabled).length}</b><small>Imagens selecionadas</small></div><div class="stat"><b>${refList().length}</b><small>Referências</small></div><div class="stat"><b>${slotList().filter(([i,s])=>s.status==='completed').length}</b><small>Resultados preservados</small></div></div><div class="note">Comece pelas referências: aprove a identidade dos personagens e o visual de lugares e objetos. Depois revise os kits e acompanhe a fila. Reabrir esta tela preserva o projeto.</div><div class="actions"><button class="primary" data-stage="characters">Ver personagens</button><button data-stage="kits">Ver kits</button></div>`:''}<div class="import-box"><div style="font-size:34px;margin-bottom:12px;color:var(--accent)">↥</div><h2>Importar manifesto</h2><p>Escolha o JSON de produção. Prompts, vínculos e seleção de fundos são mantidos. O estado JSON restaura suas escolhas no projeto salvo neste PC.</p><div class="actions" style="justify-content:center"><button class="primary" data-action="import">Selecionar JSON</button><button data-action="paste">Colar JSON</button></div></div>`}
function referenceCard(r){const approved=!!r.approved_shot_id,shot=r.shots.find(s=>s.id===r.approved_shot_id)||r.shots.at(-1),working=r.candidate_status.some(j=>j&&['processing','queued'].includes(j.status));return `<article class="card">${shot?`<img class="cover" src="${esc(shot.url)}" alt="${esc(r.name)}" data-preview="${esc(shot.url)}" data-title="${esc(r.name)}">`:`<div class="placeholder cover"><span style="font-size:44px">${r.kind==='character'?'♙':r.kind==='place'?'⌂':'◇'}</span><span>${working?'Gerando referência…':'Sem imagem aprovada'}</span></div>`}<div class="card-body"><div class="row"><h3 style="margin:0">${esc(r.name)}</h3><span class="tag ${approved?'approved':''}">${approved?'Aprovada':shot?'Avaliar imagem':'Aguardando'}</span></div><small>[${esc(r.tag)}] · ${r.shots.length} variações</small>${r.kind==='character'?`<p style="margin:10px 0 0;font-size:12px;color:var(--amber)">${r.profile_missing.length?'Ficha visual: falta '+esc(r.profile_missing.join(', ')):'Ficha visual detalhada · interpretação artística'}</p><div class="actions"><button class="primary" data-action="ref-profile" data-id="${esc(r.id)}">Ficha visual</button><button data-action="ref-effective" data-id="${esc(r.id)}">Ver prompt usado</button></div>`:''}<div class="actions">${r.candidate_status.filter(j=>j&&['queued','processing'].includes(j.status)).map(j=>`<button data-action="cancel-job" data-job="${esc(j.job_id)}">Interromper</button>`).join('')}<button class="primary" data-action="ref-generate" data-id="${esc(r.id)}" ${working?'disabled':''}>${working?'Gerando…':r.shots.length?'Nova variação':'Gerar'}</button><button data-action="ref-upload" data-id="${esc(r.id)}">Reutilizar imagem</button><button data-action="ref-prompt" data-id="${esc(r.id)}">Editar prompt importado</button>${approved?`<button data-action="ref-unapprove" data-id="${esc(r.id)}">Retirar aprovação</button>`:''}</div><div class="shots">${r.shots.map(s=>`<div style="flex-shrink:0;text-align:center"><button title="Ver imagem ampliada" class="${s.id===r.approved_shot_id?'chosen':''}" data-preview="${esc(s.url)}" data-title="${esc(r.name)}"><img src="${esc(s.url)}" alt="Variação de ${esc(r.name)}"></button><button style="display:block;width:auto;height:auto;font-size:10px;padding:4px;margin-top:4px" data-action="approve" data-id="${esc(r.id)}" data-shot="${esc(s.id)}">${s.id===r.approved_shot_id?'✓ Aprovada':'Aprovar'}</button></div>`).join('')}</div>${r.candidate_status.filter(j=>j&&['failed','uncertain'].includes(j.status)).map(j=>`<small style="color:var(--amber)">${esc(j.error)} ${j.status==='uncertain'?`<button data-action="reconcile" data-job="${esc(j.job_id)}">Recuperar resultado</button>`:''}</small>`).join('')}</div></article>`}
function renderReferences(){const people=stage==='characters',refs=refList().filter(r=>people?r.kind==='character':r.kind!=='character');$('content').innerHTML=`<div class="heading"><div><h2>${people?'Personagens':'Lugares e objetos'}</h2><p>${people?'Gere e aprove uma identidade visual para reutilizar nas cenas.':'Defina o visual dos ambientes e dos objetos recorrentes.'}</p></div><button class="primary" data-action="batch-refs">Gerar referências pendentes</button></div><div class="grid">${refs.map(referenceCard).join('')}</div><div class="note">Clique na imagem para ampliar; depois use Aprovar abaixo da miniatura. Gerar outra variação preserva a aprovação anterior. Com revisão manual desligada, apenas a primeira imagem é aprovada automaticamente.</div>`}
function slotCard(index,s){const image=s.job?.images?.[0],links=s.reference_ids.map(id=>project.reference_catalog[id]?.tag||id).join(', ');return `<div class="slot ${s.enabled?'':'disabled'}"><div class="slot-title"><b>${labels[role(index)]}</b><span class="${s.stale?'warn':''}">${s.stale?'Referência/prompt mudou':stateLabels[s.status]||s.status}</span></div>${image?`<img src="${esc(image.url)}" alt="${index}.png" data-preview="${esc(image.url)}" data-title="${index}.png">`:`<div class="empty">${!s.enabled?'Não gerar':s.status==='processing'?'Gerando…':esc(s.blocked_reason||'Aguardando geração')}</div>`}${s.job&&['queued','processing'].includes(s.job.status)?`<button data-action="cancel-job" data-job="${esc(s.job.job_id)}">Interromper imagem</button>`:''}<small>${index}.png${links?' · '+esc(links):''}</small><select aria-label="Seleção ${index}" data-slot-selection="${index}"><option value="inherit" ${s.selection_override===null?'selected':''}>Geral (${project.settings.global_selection[role(index)]?'gerar':'não gerar'})</option><option value="true" ${s.selection_override===true?'selected':''}>Gerar neste kit</option><option value="false" ${s.selection_override===false?'selected':''}>Não gerar neste kit</option></select><div class="actions"><button data-action="slot-prompt" data-id="${index}">Prompt</button><button data-action="slot-refs" data-id="${index}">Referências</button><button data-action="slot-generate" data-id="${index}" ${!s.enabled||['processing','queued'].includes(s.status)?'disabled':''}>${s.status==='completed'?'Nova versão':s.status==='failed'?'Tentar novamente':'Gerar'}</button></div>${s.job?.error?`<small style="color:var(--amber)">${esc(s.job.error)}</small>`:''}${s.status==='uncertain'?`<button data-action="reconcile" data-job="${esc(s.job_id)}">Recuperar resultado</button>`:''}</div>`}
function renderKits(){const scenes=project.manifest.timeline||[];const ids=[...new Set(Object.keys(project.slots).map(i=>i.match(/^\d+/)[0]))];$('content').innerHTML=`<div class="heading"><div><h2>Kits de produção</h2><p>Revise prompts, vínculos e exceções antes de gerar. Resultados anteriores são preservados.</p></div><button data-action="review-all">Revisar todas as cenas</button></div><div class="kit-grid">${ids.map(id=>{const scene=scenes.find(s=>String(s.id).padStart(3,'0')===id),indices=['P','R','P_bg','R_bg'].map(r=>id+r);return `<article class="card"><div class="kit-head"><div class="row"><span class="tag">Kit ${id}</span><button data-action="review-kit" data-id="${id}" style="font-size:11px;padding:5px 9px">${indices.every(i=>project.slots[i].reviewed)?'✓ Revisado':'Marcar revisado'}</button></div><p>${esc(scene?.question?.text||scene?.title||'Kit '+id)}</p></div><div class="slot-grid">${indices.map(i=>slotCard(i,project.slots[i])).join('')}</div></article>`}).join('')}</div>`}
function renderGeneration(){const slots=slotList().filter(([i,s])=>s.enabled);$('content').innerHTML=`<div class="heading"><div><h2>Acompanhar geração</h2><p>Uma imagem por vez. Pausar impede novos inícios; retomar preserva o que já terminou.</p></div><button data-action="refresh">Atualizar agora</button></div><div class="list">${slots.map(([i,s])=>`<div class="list-row">${s.job?.images?.[0]?`<img src="${esc(s.job.images[0].url)}" alt="${i}.png" data-preview="${esc(s.job.images[0].url)}" data-title="${i}.png">`:''}<div><b>${i}.png</b><div class="muted" style="font-size:12px">${esc(s.blocked_reason||s.job?.error||s.reference_ids.map(r=>project.reference_catalog[r]?.name).join(' · '))}</div></div><span class="tag ${s.status==='completed'?'approved':s.status==='uncertain'||s.status==='failed'?'warn':''}">${stateLabels[s.status]||s.status}</span>${s.status==='uncertain'?`<button data-action="reconcile" data-job="${esc(s.job_id)}">Recuperar</button>`:''}</div>`).join('')}</div>`}
function renderDownloads(){const completed=slotList().filter(([i,s])=>s.enabled&&s.status==='completed'&&s.job?.images?.[0]);$('content').innerHTML=`<div class="heading"><div><h2>Imagens e downloads</h2><p>${completed.length} imagens selecionadas prontas. Os nomes seguem o formato do app Quiz.</p></div><div class="actions" style="margin:0"><button data-action="export" ${!completed.length?'disabled':''}>Preparar arquivos</button><button class="primary" data-action="zip" ${!completed.length?'disabled':''}>Baixar ZIP</button><button data-action="backup">Salvar estado JSON</button></div></div><div class="note">Cenas nativas em 1024×576. A exportação prepara 1920×1080 por redimensionamento. O índice identifica arquivos concluídos e pendentes.</div><div class="grid">${completed.map(([i,s])=>`<article class="card"><img style="width:100%;aspect-ratio:16/9;object-fit:cover" src="${esc(s.job.images[0].url)}" alt="${i}.png" data-preview="${esc(s.job.images[0].url)}" data-title="${i}.png"><div class="card-body row"><b>${i}.png</b><a href="${esc(s.job.images[0].url)}" download="${i}.png">PNG nativo</a></div></article>`).join('')}</div>`}
function editor(title,body,save){modal=save;$('editor-title').textContent=title;$('editor-body').innerHTML=body;$('editor').showModal()}
async function settings(changes){project=await api(route()+'/settings','PATCH',{changes});lastRendered='';render()}
async function edit(target,id,changes){project=await api(route()+'/'+target+'/'+encodeURIComponent(id),'PATCH',{changes});lastRendered='';render()}
async function importManifest(manifest){if(manifest.project_id&&manifest.slots&&manifest.settings){await api('/api/v1/production/'+encodeURIComponent(manifest.project_id)+'/restore','POST',{changes:manifest});await listProjects();await openProject(manifest.project_id);toast('Estado restaurado neste PC; imagens preservadas.');return}const rawId=manifest.video?.id||manifest.project?.title||'quiz',id=rawId.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,65)+'-local';await api('/api/v1/quiz/import','POST',{manifest,project_id:id});await listProjects();stage='characters';await openProject(id);toast('Manifesto importado. Referências e seleção preservadas.')}
function saveJSON(filename,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
document.addEventListener('click',async e=>{const button=e.target.closest('[data-action],[data-stage],[data-preview]');if(!button)return;try{
 if(button.dataset.stage){stage=button.dataset.stage;lastRendered='';render();return}
 if(button.dataset.preview){$('lightbox-title').textContent=button.dataset.title||'Imagem';$('lightbox-image').src=button.dataset.preview;$('lightbox').showModal();return}
 const action=button.dataset.action,id=button.dataset.id;
 if(action==='import')$('manifest-file').click();
 else if(action==='paste')editor('Colar manifesto JSON','<textarea id="json-text" aria-label="Conteúdo JSON" placeholder="Cole o manifesto aqui"></textarea>',async()=>importManifest(JSON.parse($('json-text').value)));
 else if(action==='ref-prompt'||action==='slot-prompt'){const target=action==='ref-prompt'?'reference':'slot',item=target==='reference'?project.reference_catalog[id]:project.slots[id];editor('Editar prompt — '+(item.name||id+'.png'),`<textarea id="prompt-text" aria-label="Prompt">${esc(item.prompt)}</textarea>`,async()=>edit(target,id,{prompt:$('prompt-text').value,expected:{prompt:item.prompt}}))}
 else if(action==='ref-profile'){const ref=project.reference_catalog[id],before=JSON.parse(JSON.stringify(ref.visual_profile||{}));editor('Ficha visual — '+ref.name,`<p class="muted">Defina a aparência artística deste personagem. Não é uma reconstrução histórica comprovada. A ficha forma o retrato; a ação fica nos prompts das cenas. O prompt importado permanece preservado.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">${Object.entries(ref.profile_fields).map(([key,label])=>`<label>${esc(label)}<textarea data-profile="${key}" aria-label="${esc(label)}" style="min-height:70px;margin-top:5px">${esc(before[key]||'')}</textarea></label>`).join('')}</div><p class="muted">Alterar a ficha retira a aprovação anterior e preserva as imagens. Depois de salvar, use “Nova variação” e examine a imagem ampliada antes de aprovar.</p>`,async()=>edit('reference',id,{visual_profile:Object.fromEntries([...$('editor-body').querySelectorAll('[data-profile]')].map(x=>[x.dataset.profile,x.value])),expected:{visual_profile:before}}))}
 else if(action==='ref-effective'){const ref=project.reference_catalog[id];editor('Prompt do retrato — '+ref.name,`<p class="muted">Este é o texto que o motor usará na próxima geração. Edite a ficha visual para alterar as características.</p><textarea readonly style="min-height:340px">${esc(ref.effective_reference_prompt)}</textarea>`,null)}
 else if(action==='ref-unapprove'){await edit('reference',id,{clear_approval:true});toast('Aprovação retirada. Imagens anteriores preservadas.')}
 else if(action==='ref-generate'){await api(route()+'/references/generate','POST',{reference_id:id,seed:seed(),attempt_id:attempt()});toast('Referência enviada à fila.');await update()}
 else if(action==='ref-upload'){uploadRef=id;$('reference-file').click()}
 else if(action==='approve'){await api(route()+'/references/approve','POST',{reference_id:id,shot_id:button.dataset.shot});toast('Referência aprovada. Resultados existentes preservados.');await update()}
 else if(action==='batch-refs'){await api(route()+'/batch/start','POST',{phase:'references'});await update()}
 else if(action==='slot-refs'){const slot=project.slots[id];editor('Referências — '+id+'.png',`<div class="ref-options">${refList().map(r=>{const s=r.shots.find(x=>x.id===r.approved_shot_id);return `<label><input type="checkbox" data-link="${esc(r.id)}" ${slot.reference_ids.includes(r.id)?'checked':''}>${s?`<img src="${esc(s.url)}" alt="">`:''}<span>${esc(r.name)}<small style="display:block">${s?'Aprovada':'Sem aprovação'}</small></span></label>`}).join('')}</div>`,async()=>edit('slot',id,{reference_ids:[...$('editor-body').querySelectorAll('[data-link]:checked')].map(x=>x.dataset.link),expected:{reference_ids:slot.reference_ids}}))}
 else if(action==='slot-generate'){const s=project.slots[id];await api('/api/v1/quiz/generate','POST',{project_id:current,source_index:id,seed:seed(),engine:project.settings.engine,attempt_id:attempt(),retry_failed:['failed','cancelled'].includes(s.status),regenerate:s.status==='completed'});toast('Cena enviada à fila.');await update()}
 else if(action==='review-all')await settings({review_all:true});
 else if(action==='review-kit'){for(const r of ['P','R','P_bg','R_bg'])await edit('slot',id+r,{reviewed:true})}
 else if(action==='refresh')await update();
 else if(action==='cancel-job'){await api(route()+'/batch/pause','POST');await api('/api/v1/jobs/'+encodeURIComponent(button.dataset.job)+'/cancel','POST');toast('Interrupção solicitada. Aguardando confirmação do motor.');await update()}
 else if(action==='reconcile'){await api('/api/v1/jobs/'+encodeURIComponent(button.dataset.job)+'/reconcile','POST');await update()}
 else if(action==='backup')saveJSON(current+'_projeto.json',project);
 else if(action==='export'){const result=await api('/api/v1/quiz/'+encodeURIComponent(current)+'/export','POST');toast(`${result.files.length} arquivos preparados na pasta do projeto. ${result.missing.length} pendentes.`)}
 else if(action==='zip'){window.location.href=route()+'/zip'}
}catch(error){toast(error.message)}});
document.addEventListener('change',async e=>{try{if(e.target.dataset.global)await settings({global_selection:{[e.target.dataset.global]:e.target.checked}});if(e.target.dataset.slotSelection)await edit('slot',e.target.dataset.slotSelection,{selection_override:e.target.value==='inherit'?null:e.target.value==='true'})}catch(error){toast(error.message)}});
$('projects').onchange=e=>{if(e.target.value)openProject(e.target.value)};$('import-top').onclick=()=>$('manifest-file').click();$('manifest-file').onchange=async e=>{try{if(e.target.files[0])await importManifest(JSON.parse(await e.target.files[0].text()))}catch(error){toast(error.message)}finally{e.target.value=''}};
$('reference-file').onchange=async e=>{try{if(!e.target.files[0])return;const form=new FormData();form.append('reference_id',uploadRef);form.append('file',e.target.files[0]);form.append('approve_image','false');const r=await fetch(route()+'/references/upload',{method:'POST',body:form});if(!r.ok)throw Error((await r.json()).detail);toast('Imagem adicionada. Clique na miniatura para aprovar.');await update()}catch(error){toast(error.message)}finally{e.target.value=''}};
$('require-profiles').onchange=e=>settings({require_character_profiles:e.target.checked}).catch(error=>toast(error.message));$('manual').onchange=e=>settings({manual_review:e.target.checked}).catch(error=>toast(error.message));$('same-bg').onchange=e=>settings({use_same_background:e.target.checked}).catch(error=>toast(error.message));$('engine').onchange=e=>settings({engine:e.target.value}).catch(error=>toast(error.message));$('start').onclick=async()=>{try{await api(route()+'/batch/start','POST',{phase:'all'});stage='generation';await update()}catch(error){toast(error.message)}};$('pause').onclick=async()=>{try{await api(route()+'/batch/pause','POST');await update()}catch(error){toast(error.message)}};
$('editor-cancel').onclick=()=>$('editor').close();$('editor-save').onclick=async()=>{try{if(modal)await modal();$('editor').close()}catch(error){toast(error.message)}};$('lightbox-close').onclick=()=>$('lightbox').close();
async function boot(){nav();renderProject();try{await listProjects();const saved=localStorage.getItem('quiz-studio-project'),id=projectList.some(p=>p.project_id===saved)?saved:projectList.find(p=>p.project_id==='exodo-local-referencias-20261011')?.project_id;if(id)await openProject(id);const c=await api('/api/v1/system/capabilities');$('connection').textContent=c.reference_composition?'Motor local com referências pronto':'Modelos de referências indisponíveis'}catch(e){toast(e.message)}}
boot();setInterval(()=>{if(!document.hidden&&!$('editor').open&&!$('lightbox').open)update()},5000);
</script></body></html>
